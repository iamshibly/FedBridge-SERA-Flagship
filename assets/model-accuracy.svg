<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1280" height="770" viewBox="0 0 1280 770"><title id="title">Reported accuracy comparison for FedBridge++ and baseline models</title><desc id="desc">Accuracy on the main benchmark from the manuscript Table III and Table IV. FedBridge++ 96.02 percent. TransDNA MLP Num 94.85 percent; TransDNA MLP Mean 94.40 percent; TransDNA Linear 93.90 percent; TransDNA Deep MLP 93.90 percent; TransDNA Attention 92.30 percent; FedBridge++ with encoding removed 91.80 percent. The horizontal axis begins at 90 percent and ends at 100 percent.</desc><rect width="1280" height="770" fill="#F8FAFD"/><text x="42" y="67" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#142C45">FedBridge++ compared with baseline models</text><text x="42" y="107" font-family="Arial,sans-serif" font-size="19" fill="#59708C">Paper-reported primary-benchmark accuracy (higher is better)</text><text x="42" y="138" font-family="Arial,sans-serif" font-size="16" fill="#6E8194">Horizontal bars use a 90%–100% axis to show small differences clearly.</text><text x="42" y="211" font-family="Arial,sans-serif" font-size="20" fill="#233D5A" font-weight="700">FedBridge++</text><rect x="385" y="182" width="750" height="40" rx="7" fill="#E5EBF1"/><rect x="385" y="182" width="451.50" height="40" rx="7" fill="#087F8C"/><text x="849.4999999999998" y="210" font-family="Arial,sans-serif" font-weight="700" font-size="19" fill="#213C58">96.02%</text><text x="42" y="282" font-family="Arial,sans-serif" font-size="20" fill="#233D5A" font-weight="400">TransDNA-MLP-Num</text><rect x="385" y="253" width="750" height="40" rx="7" fill="#E5EBF1"/><rect x="385" y="253" width="363.75" height="40" rx="7" fill="#6785A1"/><text x="761.7499999999995" y="281" font-family="Arial,sans-serif" font-weight="700" font-size="19" fill="#213C58">94.85%</text><text x="42" y="353" font-family="Arial,sans-serif" font-size="20" fill="#233D5A" font-weight="400">TransDNA-MLP-Mean</text><rect x="385" y="324" width="750" height="40" rx="7" fill="#E5EBF1"/><rect x="385" y="324" width="330.00" height="40" rx="7" fill="#6785A1"/><text x="728.0000000000005" y="352" font-family="Arial,sans-serif" font-weight="700" font-size="19" fill="#213C58">94.40%</text><text x="42" y="424" font-family="Arial,sans-serif" font-size="20" fill="#233D5A" font-weight="400">TransDNA-Linear</text><rect x="385" y="395" width="750" height="40" rx="7" fill="#E5EBF1"/><rect x="385" y="395" width="292.50" height="40" rx="7" fill="#6785A1"/><text x="690.5000000000005" y="423" font-family="Arial,sans-serif" font-weight="700" font-size="19" fill="#213C58">93.90%</text><text x="42" y="495" font-family="Arial,sans-serif" font-size="20" fill="#233D5A" font-weight="400">TransDNA-DeepMLP</text><rect x="385" y="466" width="750" height="40" rx="7" fill="#E5EBF1"/><rect x="385" y="466" width="292.50" height="40" rx="7" fill="#6785A1"/><text x="690.5000000000005" y="494" font-family="Arial,sans-serif" font-weight="700" font-size="19" fill="#213C58">93.90%</text><text x="42" y="566" font-family="Arial,sans-serif" font-size="20" fill="#233D5A" font-weight="400">TransDNA-Attn</text><rect x="385" y="537" width="750" height="40" rx="7" fill="#E5EBF1"/><rect x="385" y="537" width="172.50" height="40" rx="7" fill="#6785A1"/><text x="570.4999999999998" y="565" font-family="Arial,sans-serif" font-weight="700" font-size="19" fill="#213C58">92.30%</text><text x="42" y="637" font-family="Arial,sans-serif" font-size="20" fill="#233D5A" font-weight="400">FedBridge++ without encoding</text><rect x="385" y="608" width="750" height="40" rx="7" fill="#E5EBF1"/><rect x="385" y="608" width="135.00" height="40" rx="7" fill="#CA7E43"/><text x="532.9999999999998" y="636" font-family="Arial,sans-serif" font-weight="700" font-size="19" fill="#213C58">91.80%</text><text x="42" y="713" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#234A66">Removing the proposed encoding lowered accuracy by about 4.22 percentage points.</text><text x="42" y="746" font-family="Arial,sans-serif" font-size="15" fill="#667B92">Sources: FedBridge++ manuscript, Tables III–IV. Illustrative summary of the reported results; not a new experiment.</text></svg>