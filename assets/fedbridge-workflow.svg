<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1370" height="570" viewBox="0 0 1370 570"><title id="title">FedBridge++ workflow</title><desc id="desc">Five stages: split-first data cleaning, SQ-DNA numeric and categorical tokenization, four-client federated self-supervised pretraining with masked-token reconstruction and VICReg using FedAvg, nested cross-validation and supervised fine tuning, and held-out evaluation with explainable AI.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52718F"/></marker></defs><rect width="1370" height="570" fill="#F8FAFD"/><text x="32" y="60" font-family="Arial,sans-serif" font-weight="700" font-size="33" fill="#142C45">FedBridge++: how the method works</text><text x="32" y="96" font-family="Arial,sans-serif" font-size="18" fill="#59708C">A simplified overview of the workflow reported in the SERA 2026 research manuscript</text><rect x="32" y="154" width="239" height="229" rx="16" fill="#E8F0FF" stroke="#A4BCEE" stroke-width="2"/><rect x="46" y="167" width="211" height="6" rx="3" fill="#A4BCEE"/><text x="50" y="217" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#18324F">Clean and split</text><text x="50" y="260" font-family="Arial,sans-serif" font-size="16" fill="#37506D">Remove IDs and duplicates</text><text x="50" y="294" font-family="Arial,sans-serif" font-size="16" fill="#37506D">80% TrainVal / 20% holdout</text><path d="M 272 269 L 297 269" stroke="#52718F" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="298" y="154" width="239" height="229" rx="16" fill="#E8F7F4" stroke="#9ED7CA" stroke-width="2"/><rect x="312" y="167" width="211" height="6" rx="3" fill="#9ED7CA"/><text x="316" y="217" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#18324F">SQ-DNA features</text><text x="316" y="260" font-family="Arial,sans-serif" font-size="16" fill="#37506D">Numeric quantile bins</text><text x="316" y="294" font-family="Arial,sans-serif" font-size="16" fill="#37506D">Categorical tokens + OOV</text><path d="M 538 269 L 563 269" stroke="#52718F" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="564" y="154" width="239" height="229" rx="16" fill="#F0EBFF" stroke="#C5B4EF" stroke-width="2"/><rect x="578" y="167" width="211" height="6" rx="3" fill="#C5B4EF"/><text x="582" y="217" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#18324F">Federated SSL</text><text x="582" y="260" font-family="Arial,sans-serif" font-size="16" fill="#37506D">4 simulated clients</text><text x="582" y="294" font-family="Arial,sans-serif" font-size="16" fill="#37506D">Masked tokens + VICReg</text><text x="582" y="328" font-family="Arial,sans-serif" font-size="16" fill="#37506D">FedAvg updates</text><path d="M 804 269 L 829 269" stroke="#52718F" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="830" y="154" width="239" height="229" rx="16" fill="#FFF3E1" stroke="#EDCE95" stroke-width="2"/><rect x="844" y="167" width="211" height="6" rx="3" fill="#EDCE95"/><text x="848" y="217" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#18324F">Fine-tune</text><text x="848" y="260" font-family="Arial,sans-serif" font-size="16" fill="#37506D">Nested cross-validation</text><text x="848" y="294" font-family="Arial,sans-serif" font-size="16" fill="#37506D">Supervised Transformer</text><text x="848" y="328" font-family="Arial,sans-serif" font-size="16" fill="#37506D">Select threshold</text><path d="M 1070 269 L 1095 269" stroke="#52718F" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="1096" y="154" width="239" height="229" rx="16" fill="#E9F5E7" stroke="#AED5AC" stroke-width="2"/><rect x="1110" y="167" width="211" height="6" rx="3" fill="#AED5AC"/><text x="1114" y="217" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#18324F">Evaluate &amp; explain</text><text x="1114" y="260" font-family="Arial,sans-serif" font-size="16" fill="#37506D">Locked holdout + external</text><text x="1114" y="294" font-family="Arial,sans-serif" font-size="16" fill="#37506D">SHAP, LIME, mask tests</text><rect x="32" y="426" width="636" height="104" rx="14" fill="#fff" stroke="#D5E1ED" stroke-width="2"/><text x="52" y="464" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#1F415D">What stays local?</text><text x="52" y="494" font-family="Arial,sans-serif" font-size="17" fill="#425B72">Raw records are not exchanged during the simulated SSL stage.</text><rect x="694" y="426" width="639" height="104" rx="14" fill="#fff" stroke="#D5E1ED" stroke-width="2"/><text x="714" y="464" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#1F415D">Research limits</text><text x="714" y="494" font-family="Arial,sans-serif" font-size="17" fill="#425B72">No claim of differential privacy or production deployment.</text></svg>